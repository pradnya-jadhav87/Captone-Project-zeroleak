<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <title>Prism — AI LaTeX Editor | ZeroLeak AI</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #18181b;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .chrome-header {
      height: 38px;
      background: #202124;
      border-bottom: 1px solid #3c4043;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      user-select: none;
    }
    .chrome-tab {
      height: 30px;
      max-width: 320px;
      padding: 0 14px;
      background: #292a2d;
      border-radius: 8px 8px 0 0;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: #e8eaed;
      font-weight: 500;
    }
    .chrome-badge {
      font-size: 11px;
      color: #34d399;
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.3);
      padding: 2px 10px;
      border-radius: 12px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .chrome-badge-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #34d399;
    }
    .chrome-controls {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .chrome-btn {
      width: 26px;
      height: 26px;
      border-radius: 4px;
      background: transparent;
      border: none;
      color: #9aa0a6;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      transition: all 0.15s ease;
    }
    .chrome-btn:hover {
      background: rgba(255,255,255,0.1);
      color: #fff;
    }
    .chrome-btn.close:hover {
      background: #e81123;
      color: #fff;
    }
    .prism-frame-container {
      width: 100%;
      height: calc(100% - 38px);
      position: relative;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: 0;
      background: #18181b;
      display: block;
    }
  </style>
</head>
<body>
  <div class="chrome-header">
    <div class="chrome-tab">
      <span style="color:#34d399;font-weight:bold;">✦</span>
      <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">Prism — AI LaTeX Editor | ZeroLeak AI</span>
    </div>
    <div class="chrome-badge">
      <span class="chrome-badge-dot"></span>
      <span>AI LaTeX Synthesis • Verified Secure Enclave</span>
    </div>
    <div class="chrome-controls">
      <button class="chrome-btn" onclick="document.querySelector('iframe').src = 'https://prism.openai.com/';" title="Reload">↻</button>
      <button class="chrome-btn close" onclick="window.close();" title="Close">✕</button>
    </div>
  </div>
  <div class="prism-frame-container">
    <iframe
      src="https://prism.openai.com/"
      title="OpenAI Prism AI LaTeX Workspace"
      referrerpolicy="no-referrer"
      allow="clipboard-write; clipboard-read; camera; microphone; fullscreen; display-capture; geolocation; storage-access; identity-credentials-get"
    ></iframe>
  </div>
</body>
</html>
