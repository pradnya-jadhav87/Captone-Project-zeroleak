    function parseTabularHtml(raw) {
      const match = raw.match(/\\begin\{tabular\}\{[^}]*\}([\s\S]*?)\\end\{tabular\}/i);
      if (!match) return null;
      const content = match[1];
      const rows = content.split(/\\\\|\\cr/).map(r => r.replace(/\\(?:hline|toprule|midrule|bottomrule)/g, '').trim()).filter(r => r.length > 0);
      if (rows.length === 0) return null;
      const parsedRows = rows.map(r => r.split('&').map(cell => cell.replace(/\\textbf\{([^}]+)\}/g, '$1').replace(/[{}]/g, '').trim()));
      let html = '<div style="margin:12px 0;display:flex;justify-content:center;overflow-x:auto;"><table style="border-collapse:collapse;border:1px solid #000;text-align:center;font-size:11px;">';
      parsedRows.forEach((r, rIdx) => {
        html += `<tr style="${rIdx === 0 ? 'background:#f1f5f9;font-weight:bold;' : rIdx % 2 === 1 ? 'background:#f8fafc;' : ''}">`;
        r.forEach(cell => {
          html += `<td style="border:1px solid #000;padding:4px 10px;">${escapeHtml(cell)}</td>`;
        });
        html += '</tr>';
      });
      html += '</table></div>';
      return html;
    }

    function cleanLatexText(text) {
      if (!text) return '';
      return text
        .replace(/\\textbf\{([^}]*)\}/g, '$1')
        .replace(/\\textit\{([^}]*)\}/g, '$1')
        .replace(/\\textsf\{([^}]*)\}/g, '$1')
        .replace(/\\textrm\{([^}]*)\}/g, '$1')
        .replace(/\\texttt\{([^}]*)\}/g, '$1')
        .replace(/\\underline\{([^}]*)\}/g, '$1')
        .replace(/\\emph\{([^}]*)\}/g, '$1')
        .replace(/\\mbox\{([^}]*)\}/g, '$1')
        .replace(/\\large\b/g, '')
        .replace(/\\Large\b/g, '')
        .replace(/\\LARGE\b/g, '')
        .replace(/\\small\b/g, '')
        .replace(/\\normalsize\b/g, '')
        .replace(/\\noindent\b/g, '')
        .replace(/\\centering\b/g, '')
        .replace(/\\hfill\b/g, ' ')
        .replace(/\\quad\b/g, ' ')
        .replace(/\\qquad\b/g, ' ')
        .replace(/\\vspace\*?\{[^}]*\}/g, '')
        .replace(/\\hspace\*?\{[^}]*\}/g, ' ')
        .replace(/\\\\(?:\[[^\]]*\])?/g, '\n')
        .replace(/\\&/g, '&')
        .replace(/\\%/g, '%')
        .replace(/\\#/g, '#')
        .replace(/\\_/g, '_')
        .replace(/---/g, '—')
        .replace(/--/g, '–')
        .replace(/[{}]/g, '')
        .trim();
    }

    function parsePicturePages(code) {
      let rawChunks = code.split(/(?=\\begin\{picture\}|\\clearpage|\\newpage|\\pagebreak|%+\s*(?:---+\s*)?PAGE\s*\d+)/i);
      if (rawChunks.length === 0) rawChunks = [code];
      const chunks = [];
      rawChunks.forEach(chunk => {
        const sub = chunk.split(/(?<=\\end\{picture\})/i);
        sub.forEach(s => { if (s.trim().length > 0) chunks.push(s); });
      });

      const pages = [];
      chunks.forEach(chunk => {
        if (!chunk.includes('\\put')) return;
        const items = [];
        const regex = /\\put\s*\(\s*([-\d.]+)\s*,\s*([-\d.]+)\s*\)\s*\{/g;
        let match;
        while ((match = regex.exec(chunk)) !== null) {
          const x = parseFloat(match[1]);
          const y = parseFloat(match[2]);
          const startIdx = match.index + match[0].length;
          let depth = 1;
          let endIdx = startIdx;
          while (depth > 0 && endIdx < chunk.length) {
            if (chunk[endIdx] === '{') depth++;
            else if (chunk[endIdx] === '}') depth--;
            endIdx++;
          }
          const rawContent = chunk.substring(startIdx, endIdx - 1);
          const fsMatch = rawContent.match(/\\fontsize\{([\d.]+)\}/);
          const fontSize = fsMatch ? parseFloat(fsMatch[1]) : 11;
          const isBold = /\\textbf|\\bfseries|\{ptm\}\{b\}|font-weight:\s*bold/i.test(rawContent);
          const isItalic = /\\textit|\\itshape|\{ptm\}\{it\}|font-style:\s*italic/i.test(rawContent);
          let text = rawContent
            .replace(/\\fontsize\{[^}]*\}\{[^}]*\}/g, '')
            .replace(/\\usefont\{[^}]*\}\{[^}]*\}\{[^}]*\}\{[^}]*\}/g, '')
            .replace(/\\usefont\{[^}]*\}/g, '')
            .replace(/\\selectfont/g, '')
            .replace(/\\color(?:\[[^\]]*\])?\{[^}]*\}/g, '')
            .replace(/\\vphantom\{[^}]*\}/g, '')
            .replace(/\\rule(?:\[[^\]]*\])?\{[^}]*\}\{[^}]*\}/g, '')
            .replace(/\\textbf\{([^}]*)\}/g, '$1')
            .replace(/\\textit\{([^}]*)\}/g, '$1')
            .replace(/\\textsf\{([^}]*)\}/g, '$1')
            .replace(/\\textrm\{([^}]*)\}/g, '$1')
            .replace(/\\texttt\{([^}]*)\}/g, '$1')
            .replace(/\\underline\{([^}]*)\}/g, '$1')
            .replace(/\\mbox\{([^}]*)\}/g, '$1')
            .replace(/\\hspace\*?\{[^}]*\}/g, ' ')
            .replace(/\\vspace\*?\{[^}]*\}/g, ' ')
            .replace(/\\&/g, '&')
            .replace(/\\%/g, '%')
            .replace(/\\#/g, '#')
            .replace(/\\_/g, '_')
            .replace(/---/g, '—')
            .replace(/--/g, '–')
            .replace(/\\textbf\b/g, '')
            .replace(/\\textit\b/g, '')
            .replace(/\\bfseries\b/g, '')
            .replace(/\\itshape\b/g, '')
            .replace(/[{}]/g, '');
          items.push({ x, y, fontSize, isBold, isItalic, text });
        }
        if (items.length === 0) return;

        const isNegativeY = items.some(it => it.y < 0);
        const linesMap = new Map();
        for (const it of items) {
          const targetY = isNegativeY ? -Math.abs(it.y) : it.y;
          let matchedY = null;
          for (const key of linesMap.keys()) {
            if (Math.abs(key - targetY) < 3.5) { matchedY = key; break; }
          }
          if (matchedY === null) { matchedY = targetY; linesMap.set(matchedY, []); }
          linesMap.get(matchedY).push(it);
        }

        const sortedY = Array.from(linesMap.keys()).sort((a, b) => b - a);
        const allVisualTops = sortedY.map(y => (isNegativeY ? Math.abs(y) : Math.max(0, 842 - y)));
        const minVisualTop = Math.min(...allVisualTops);
        const maxVisualTop = Math.max(...allVisualTops);
        const contentSpan = maxVisualTop - minVisualTop;
        const topOffset = minVisualTop > 35 ? minVisualTop - 35 : 0;

        const lines = sortedY.map(y => {
          const row = linesMap.get(y);
          row.sort((a, b) => a.x - b.x);
          const segments = [];
          let cur = { x: row[0].x, fontSize: row[0].fontSize, isBold: row[0].isBold, isItalic: row[0].isItalic, text: row[0].text };
          for (let i = 1; i < row.length; i++) {
            const it = row[i];
            const estWidth = cur.text.length * cur.fontSize * 0.52;
            const gap = it.x - (cur.x + estWidth);
            if (gap > 20) {
              segments.push(cur);
              cur = { x: it.x, fontSize: it.fontSize, isBold: it.isBold, isItalic: it.isItalic, text: it.text };
            } else {
              if (gap > 2 && !cur.text.endsWith(' ') && !it.text.startsWith(' ')) cur.text += ' ';
              cur.text += it.text;
              if (it.isBold) cur.isBold = true;
              if (it.isItalic) cur.isItalic = true;
            }
          }
          segments.push(cur);
          const rawTop = isNegativeY ? Math.abs(y) : Math.max(0, 842 - y);
          const top = Math.max(20, Math.round(rawTop - topOffset));
          return { y, top, segments };
        });

        if (contentSpan > 820) {
          const pageSize = 800;
          const numSubPages = Math.ceil(contentSpan / pageSize);
          for (let p = 0; p < numSubPages; p++) {
            const pageStartTop = p * pageSize;
            const pageEndTop = (p + 1) * pageSize;
            const subLines = lines
              .filter(l => l.top >= pageStartTop && l.top < pageEndTop)
              .map(l => ({ ...l, top: l.top - pageStartTop + 35 }));
            if (subLines.length > 0) pages.push({ lines: subLines, height: 842 });
          }
        } else {
          const pageHeight = contentSpan < 450 && lines.length < 15 ? Math.max(300, Math.min(842, contentSpan + 100)) : 842;
          pages.push({ lines, height: pageHeight });
        }
      });
      return pages;
    }

    function compileLatexLive() {
      const editor = document.getElementById('latexEditor');
      const preview = document.getElementById('previewContainer');
      if (!editor || !preview) return;

      const code = editor.value.trim();
      if (!code) {
        preview.innerHTML = `
          <div class="paper-sheet" style="min-height:500px;display:flex;align-items:center;justify-content:center;text-align:center;">
            <div style="max-width:360px;padding:30px;border:1px dashed #cbd5e1;border-radius:10px;background:#f8fafc;">
              <div style="font-size:28px;margin-bottom:10px;">✦</div>
              <h3 style="font-size:14px;font-weight:bold;color:#1e293b;margin-bottom:6px;">Common LaTeX Compiler Ready</h3>
              <p style="font-size:11px;color:#64748b;line-height:1.5;">Paste or write your LaTeX code in the editor on the left. All subjects, question papers, equations, and picture environments compile here dynamically.</p>
            </div>
          </div>
        `;
        return;
      }

      const putMatches = code.match(/\\put\s*\(/g);
      const putCount = putMatches ? putMatches.length : 0;

      // Picture mode: Any picture environment or coordinate placement
      if (code.includes('\\begin{picture}') || putCount >= 2) {
        const pages = parsePicturePages(code);
        if (pages.length > 0) {
          let html = '<div style="display:flex;flex-direction:column;gap:32px;align-items:center;width:100%;">';
          pages.forEach((p, pIdx) => {
            html += `<div class="paper-sheet" style="position:relative;min-height:${p.height}px;height:${p.height}px;padding:0;overflow:hidden;box-shadow:0 10px 25px rgba(0,0,0,0.5);">`;
            p.lines.forEach(l => {
              html += `<div style="position:absolute;top:${l.top}px;left:0;right:0;line-height:1;">`;
              l.segments.forEach(s => {
                const weight = s.isBold ? 'font-weight:bold;' : '';
                const style = s.isItalic ? 'font-style:italic;' : '';
                html += `<span style="position:absolute;left:${s.x}px;font-size:${s.fontSize}px;color:#000;white-space:pre;${weight}${style}">${escapeHtml(s.text)}</span>`;
              });
              html += `</div>`;
            });
            html += `
              <div style="position:absolute;bottom:12px;left:30px;right:30px;border-top:1px solid rgba(0,0,0,0.2);display:flex;justify-content:space-between;font-size:9px;color:#64748b;font-family:sans-serif;padding-top:6px;">
                <span>SOLAPUR UNIVERSITY • ZEROLEAK</span>
                <span>Page ${pIdx + 1} of ${pages.length}</span>
              </div>
            </div>`;
          });
          html += '</div>';
          preview.innerHTML = html;
          return;
        }
      }

      // Multi-Page Standard Mode
      const rawPages = code.split(/(?:\\newpage|\\clearpage|\\pagebreak)/i);
      let globalUniv = (code.match(/\\textbf\{([^}]+UNIVERSITY[^}]*)\}/i) || code.match(/([A-Z\s]{8,}UNIVERSITY[A-Z\s,]*)/i) || [])[1] || '';
      let globalFac = (code.match(/\\textbf\{([^}]+FACULTY[^}]*)\}/i) || code.match(/(FACULTY OF [^\\\n}]+)/i) || [])[1] || '';
      let globalExam = (code.match(/\\textbf\{([^}]+(?:Examination|B\.Tech|T\.Y\.|M\.Tech|Engineering|Diploma)[^}]*)\}/i) || code.match(/((?:B\.Tech|T\.Y\.|Examination)[^\\\n}]+)/i) || [])[1] || '';
      let marks = (code.match(/Max\.\s*Marks:\s*(\d+)/i) || code.match(/Marks:\s*(\d+)/i) || [])[1] || '';
      let codeMatch = (code.match(/(?:Paper|Course)\s*Code:\s*([A-Za-z0-9\-_]+)/i) || [])[1] || '';
      let timeMatch = (code.match(/Time:\s*([0-9\s:AMPMapm.\-–—()Hours]+)/i) || [])[1] || '';
      let dateMatch = (code.match(/Day\s*\\?&\s*Date:\s*([^\\}\n]+)/i) || [])[1] || '';

      globalUniv = cleanLatexText(globalUniv);
      globalFac = cleanLatexText(globalFac);
      globalExam = cleanLatexText(globalExam);

      let pagesHtml = '<div style="display:flex;flex-direction:column;gap:32px;align-items:center;width:100%;">';

      rawPages.forEach((pageCode, pIdx) => {
        const pageTrim = pageCode.trim();
        if (!pageTrim) return;

        let headerHtml = '';
        if (pIdx === 0 && (globalUniv || globalFac || globalExam)) {
          headerHtml = `
            <div style="text-align:center;margin-bottom:14px;border-bottom:2px solid #000;padding-bottom:8px;">
              ${globalUniv ? `<div style="font-weight:bold;font-size:13px;text-transform:uppercase;">${escapeHtml(globalUniv)}</div>` : ''}
              ${globalFac ? `<div style="font-size:11px;font-weight:600;color:#334155;">${escapeHtml(globalFac)}</div>` : ''}
              ${globalExam ? `<div style="font-weight:bold;font-size:11px;margin-top:2px;">${escapeHtml(globalExam)}</div>` : ''}
              <div style="display:flex;justify-content:space-between;font-size:10px;margin-top:8px;border-top:1px solid #cbd5e1;padding-top:4px;">
                <span>${dateMatch ? escapeHtml(cleanLatexText(dateMatch)) : 'Day & Date: Examination Day'}</span>
                <span>Max. Marks: ${marks || '70'}</span>
              </div>
              <div style="display:flex;justify-content:space-between;font-size:10px;margin-top:2px;">
                <span>Time: ${timeMatch ? escapeHtml(cleanLatexText(timeMatch)) : '3 Hours'}</span>
                <span>Paper Code: ${codeMatch || 'EXAM-CODE'}</span>
              </div>
            </div>
          `;
        }

        const qMatches = pageTrim.match(/(?:\\noindent\s*)?(?:\\textbf\{\s*(?:[Q\.\s\d]+[^}]*)\}|(?:Question|Q\.)\s*\d+[^:\n\\]*)([\s\S]*?)(?=(?:\\noindent\s*)?(?:\\textbf\{\s*(?:Q\.\s*\d+|Question\s*\d+)|\\question\b|Q\.\s*\d+\b)|\\end\{document\}|$)/gi) || [];
        let innerContent = '';

        if (qMatches.length > 0) {
          qMatches.forEach(qBlock => {
            const titleMatch = qBlock.match(/(?:\\noindent\s*)?(?:\\textbf\{\s*([Q\.\s\d]+[^}]*)\}|(Question\s*\d+[^:\n\\]*)|(Q\.\s*\d+[^:\n\\]*))/i);
            const title = cleanLatexText(titleMatch ? (titleMatch[1] || titleMatch[2] || titleMatch[3]) : 'Question');
            const tableHtml = parseTabularHtml(qBlock);
            const cleanBody = cleanLatexText(
              qBlock
                .replace(/(?:\\noindent\s*)?\\textbf\{\s*[Q\.\s\d]+[^}]*\}\s*(?:\\hfill\s*\[\s*[^\]]+\s*\])?/i, '')
                .replace(/\\begin\{tabular\}[\s\S]*?\\end\{tabular\}/gi, '')
                .replace(/\\begin\{center\}[\s\S]*?\\end\{center\}/gi, '')
                .trim()
            );

            innerContent += `
              <div style="margin-top:14px;border-bottom:1px solid #f1f5f9;padding-bottom:10px;">
                <div style="font-weight:bold;font-size:12px;color:#0f172a;">${escapeHtml(title)}</div>
                <div style="margin-top:4px;font-size:11px;color:#334155;line-height:1.6;">${formatLatexBody(cleanBody)}</div>
                ${tableHtml || ''}
              </div>
            `;
          });
        } else {
          const lines = pageTrim.split(/\n\s*\n/).map(l => cleanLatexText(l)).filter(l => l.length > 0);
          innerContent = lines.map(p => `<p style="margin-bottom:10px;font-size:11px;color:#334155;line-height:1.6;">${escapeHtml(p)}</p>`).join('');
        }

        pagesHtml += `
          <div class="paper-sheet" style="min-height:842px;display:flex;flex-direction:column;justify-content:space-between;">
            <div>
              ${headerHtml}
              ${innerContent}
            </div>
            <div style="margin-top:20px;border-top:1px solid #000;padding-top:6px;display:flex;justify-content:space-between;font-size:9px;color:#64748b;font-family:sans-serif;">
              <span>SOLAPUR UNIVERSITY • ZEROLEAK</span>
              <span>Page ${pIdx + 1} of ${rawPages.length}</span>
            </div>
          </div>
        `;
      });

      pagesHtml += '</div>';
      preview.innerHTML = pagesHtml;
    }

    function escapeHtml(str) {
      return (str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    function formatLatexBody(text) {
      return escapeHtml(text)
        .replace(/\\item/g, '<br>• ')
        .replace(/\\textbf\{([^}]+)\}/g, '<b>$1</b>')
        .replace(/\\textit\{([^}]+)\}/g, '<i>$1</i>');
    }

    function renderApp() {
      const viewport = document.getElementById('appViewport');
      if (!isAuthenticated) {
        viewport.innerHTML = `
          <div class="auth-container">
            <div class="auth-card">
              <div class="flower-icon">
                <svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="3" style="width:100%;height:100%;">
                  <circle cx="50" cy="50" r="14" stroke="currentColor" />
                  <path d="M50 20 C60 30 65 40 50 50 C35 40 40 30 50 20 Z" stroke="currentColor" />
                  <path d="M50 80 C60 70 65 60 50 50 C35 60 40 70 50 80 Z" stroke="currentColor" />
                  <path d="M20 50 C30 40 40 35 50 50 C40 65 30 60 20 50 Z" stroke="currentColor" />
                  <path d="M80 50 C70 40 60 35 50 50 C60 65 70 60 80 50 Z" stroke="currentColor" />
                </svg>
              </div>
              <h2 class="auth-title">Welcome to Prism</h2>
              <p class="auth-subtitle">OpenAI AI LaTeX Editor • Personal Workspace</p>
              <button class="btn-login" id="btnLogin" onclick="doSignIn()">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                  <path d="M22.2819 9.8211a5.9847 5.9847 0 0 0-.5157-4.9108 6.0462 6.0462 0 0 0-6.5098-2.9A6.0651 6.0651 0 0 0 4.9807 4.1818a5.9847 5.9847 0 0 0-3.9977 2.9 6.0462 6.0462 0 0 0 .7427 7.0966 5.98 5.98 0 0 0 .511 4.9107 6.051 6.051 0 0 0 6.5146 2.9001A5.9847 5.9847 0 0 0 13.2599 24a6.0557 6.0557 0 0 0 5.7718-4.2058 5.9894 5.9894 0 0 0 3.9977-2.9001 6.0557 6.0557 0 0 0-.7475-7.0729z"/>
                </svg>
                Continue with OpenAI
              </button>
              <p class="auth-terms">By clicking "Continue with OpenAI", you agree to our Terms and have read our Privacy Policy.</p>
              <button class="btn-sub" onclick="launchRealPrismWindow()">Launch in Real Chrome Window ↗</button>
            </div>
          </div>
        `;
      } else {
        viewport.innerHTML = `
          <div class="workspace-container">
            <div class="workspace-bar">
              <div style="display:flex;align-items:center;gap:10px;">
                <span style="font-weight:700;color:#fff;font-size:14px;">✦ Prism</span>
                <span style="color:#64748b;">/</span>
                <span style="font-size:12px;color:#cbd5e1;font-weight:600;">Universal LaTeX Compiler</span>
                <span style="font-size:10px;color:#34d399;font-weight:600;background:rgba(52,211,153,0.15);padding:2px 8px;border-radius:10px;">● Ready</span>
              </div>
              <div style="display:flex;align-items:center;gap:8px;">
                <button class="btn-sub" style="margin:0;padding:6px 12px;background:#059669;color:#fff;font-weight:600;" onclick="compileLatexLive()">▶ Compile LaTeX</button>
                <button class="btn-sub" style="margin:0;padding:6px 12px;background:linear-gradient(to right, #059669, #0d9488);color:#fff;font-weight:700;" onclick="doTransferToPrintingManager()" title="Download & Transfer exact document from PC to Printing Manager">⬇ Download</button>
                <button class="btn-sub" style="margin:0;padding:6px 12px;background:rgba(52,211,153,0.15);border:1px solid rgba(52,211,153,0.3);color:#34d399;font-weight:600;" onclick="document.getElementById('latexEditor').value = PRISM_OS_LATEX; compileLatexLive();">OS (BTN04605) Paper</button>
                <button class="btn-sub" style="margin:0;padding:6px 12px;" onclick="document.getElementById('latexEditor').value = DEFAULT_LATEX; compileLatexLive();">Cryptography</button>
                <button class="btn-sub" style="margin:0;padding:6px 12px;" onclick="document.getElementById('latexEditor').value = ''; compileLatexLive();">Clear</button>
                <button class="btn-sub" style="margin:0;padding:6px 12px;" onclick="window.print()">Print</button>
                <button class="btn-sub" style="margin:0;padding:6px 12px;color:#f87171;" onclick="doSignOut()">Sign out</button>
              </div>
            </div>
            <div class="workspace-main" style="display:flex;flex:1;overflow:hidden;">
              <!-- 50/50 Split Editor (No Sidebar) -->
              <div class="workspace-editor" style="flex:1;display:flex;flex-direction:column;border-right:1px solid #2d2f34;background:#18181b;">
                <div style="height:32px;padding:0 12px;background:#1e1f22;border-bottom:1px solid #2d2f34;display:flex;align-items:center;justify-content:space-between;font-size:11px;color:#94a3b8;">
                  <span>source.tex • Universal LaTeX Editor</span>
                  <span style="color:#34d399;">● Live Sync</span>
                </div>
                <textarea id="latexEditor" class="editor-textarea" spellcheck="false" placeholder="Paste or write any LaTeX code here (all subjects, standard exam papers, equations, picture environments)...">${DEFAULT_LATEX}</textarea>
              </div>
              <!-- Live Compiled Preview -->
              <div class="workspace-preview" style="flex:1;display:flex;flex-direction:column;background:#2b2d31;overflow:auto;padding:24px;align-items:center;">
                <div id="previewContainer" style="width:100%;display:flex;justify-content:center;"></div>
              </div>
            </div>
          </div>
        `;

        // Wire live compiler
        const editor = document.getElementById('latexEditor');
        if (editor) {
          editor.addEventListener('input', compileLatexLive);
          compileLatexLive();
        }
      }
    }

    renderApp();
  </script>
